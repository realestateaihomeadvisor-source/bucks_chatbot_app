<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Bucks County Home Advisor | Chat</title>
<meta name="description" content="Chat with the Bucks County Home Advisor. Get your free AI-generated home value estimate using public market data."/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#2c4a3e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --forest:      #2c4a3e;
  --forest-mid:  #3d6355;
  --gold:        #c9973a;
  --gold-light:  #e8b84b;
  --cream:       #f8f4ee;
  --warm:        #f0e9df;
  --ink:         #1c1c1a;
  --muted:       #6b6560;
  --white:       #ffffff;
  --header-h:    64px;
  --disclaimer-h: 44px;
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%;
  height: 100dvh;
  overflow: hidden;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

/* Hide FREE badge in Voiceflow widget */
.vf-chat-header__badge,
.vf-badge,
[class*="badge"] {
  display: none !important;
}

@keyframes glow {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
  background: var(--white);
  box-shadow: 0 0 0 1px rgba(44, 74, 62, 0.06), 0 20px 60px rgba(26, 26, 26, 0.08);
}

/* ── Header ── */
.chat-header {
  flex-shrink: 0;
  height: calc(var(--header-h) + var(--safe-top));
  padding: var(--safe-top) 16px 0;
  background: var(--forest);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 10;
}

.advisor-info {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.advisor-avatar {
  width: 40px;
  height: 40px;
  background: rgba(201, 151, 58, 0.2);
  border: 2px solid rgba(201, 151, 58, 0.35);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
  flex-shrink: 0;
}

.advisor-text { min-width: 0; }

.advisor-name {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--white);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.advisor-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  color: rgba(255, 255, 255, 0.65);
  margin-top: 2px;
}

.status-dot {
  width: 6px;
  height: 6px;
  background: #4ade80;
  border-radius: 50%;
  animation: glow 2s ease-in-out infinite;
  flex-shrink: 0;
}

.header-badge {
  flex-shrink: 0;
  background: rgba(201, 151, 58, 0.2);
  border: 1px solid rgba(201, 151, 58, 0.35);
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--gold-light);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ── Chat area (fills remaining viewport) ── */
.chat-body {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: hidden;
  background: var(--white);
}

#vf-chat-embed {
  width: 100%;
  height: calc(100% + 58px);
  margin-top: -58px;
}

#vf-chat-embed iframe {
  border: none !important;
  width: 100% !important;
  height: 100% !important;
}

/* ── Disclaimer ── */
.chat-disclaimer {
  flex-shrink: 0;
  padding: 8px 14px calc(8px + var(--safe-bottom));
  background: var(--cream);
  border-top: 1px solid rgba(44, 74, 62, 0.08);
  text-align: center;
  font-size: 0.7rem;
  color: var(--muted);
  line-height: 1.45;
}

.chat-disclaimer a {
  color: var(--gold);
  text-decoration: none;
  border-bottom: 1px solid rgba(201, 151, 58, 0.35);
}

/* ── Desktop: centered phone-like frame ── */
@media (min-width: 768px) {
  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(44, 74, 62, 0.12), transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 100%, rgba(201, 151, 58, 0.1), transparent 55%),
      var(--cream);
    padding: 24px 16px;
    align-items: center;
    justify-content: center;
  }

  .app {
    height: min(900px, calc(100dvh - 48px));
    border-radius: 24px;
    overflow: hidden;
  }

  .chat-header {
    padding-left: 22px;
    padding-right: 22px;
  }

  .chat-disclaimer {
    font-size: 0.78rem;
    padding: 10px 20px;
  }
}

@media (max-width: 380px) {
  .advisor-name { font-size: 0.85rem; }
  .header-badge { display: none; }
}
</style>
</head>
<body>

<div class="app" id="chatbot">
  <header class="chat-header">
    <div class="advisor-info">
      <div class="advisor-avatar" aria-hidden="true">🏠</div>
      <div class="advisor-text">
        <div class="advisor-name">Bucks County Home Advisor</div>
        <div class="advisor-status"><span class="status-dot"></span> Online now · Responds instantly</div>
      </div>
    </div>
    <div class="header-badge">Free</div>
  </header>

  <main class="chat-body" aria-label="Chat with Bucks County Home Advisor">
    <div id="vf-chat-embed"></div>
  </main>

  <p class="chat-disclaimer">
    Estimates are AI-generated using public market data and are not professional appraisals or official valuations.
  </p>
</div>

<script type="text/javascript">
(function(d, t) {
  const PROJECT_ID  = '6a97385ba2e6e60fee4143bd';
  const VERSION_ID  = '6a97385ba2e6e60fee4143be';
  const STORAGE_KEY = 'vf_user_id_bucks_county_chat';

  var v = d.createElement(t), s = d.getElementsByTagName(t)[0];

  v.onload = function() {
    let userId = '';

    try {
      const params = new URLSearchParams(window.location.search);

      if (params.get('resetChat') === '1') {
        localStorage.removeItem(STORAGE_KEY);
      }

      userId = localStorage.getItem(STORAGE_KEY);

      if (!userId) {
        userId = 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(STORAGE_KEY, userId);
      }
    } catch (e) {
      userId = 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    }

    window.voiceflow.chat.load({
      verify:    { projectID: PROJECT_ID },
      url:       'https://general-runtime.voiceflow.com',
      versionID: VERSION_ID,
      userID:    userId,
      render: {
        mode:   'embedded',
        target: document.getElementById('vf-chat-embed'),
      },
      autostart: true,
      launch: {
        event: { type: 'launch', payload: {} }
      },
      assistant: {
        title:       'Bucks County Home Advisor',
        description: 'Get your free AI home value estimate',
        color:       '#2c4a3e',
        persistence: 'memory',
      }
    });
  };

  v.src = 'https://cdn.voiceflow.com/widget/bundle.mjs';
  v.type = 'text/javascript';
  s.parentNode.insertBefore(v, s);
})(document, 'script');
</script>

</body>
</html>
